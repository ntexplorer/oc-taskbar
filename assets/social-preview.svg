<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="oc-taskbar — task monitor and usage statusline for the OpenCode V2 TUI">
  <defs>
    <linearGradient id="bg" x1="48" y1="12" x2="1228" y2="628" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="title" x1="204" y1="186" x2="486" y2="254" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 48) rotate(48) scale(330 330)">
      <stop stop-color="#22D3EE" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 590) rotate(-140) scale(360 360)">
      <stop stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="640"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#grid)"/>
    <circle cx="190" cy="48" r="330" fill="url(#glowCyan)"/>
    <circle cx="1150" cy="590" r="360" fill="url(#glowViolet)"/>
    <rect x="1" y="1" width="1278" height="638" stroke="#94A3B8" stroke-opacity="0.16"/>
  </g>

  <!-- left: identity -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <rect x="80" y="96" width="286" height="38" rx="19" fill="#0F2233" stroke="#1E4D63"/>
    <circle cx="103" cy="115" r="5" fill="#34D399"/>
    <text x="120" y="120" fill="#A5F3FC" font-size="14" font-weight="600" letter-spacing="0.4">OpenCode V2 TUI Plugin</text>

    <text x="80" y="252" fill="#F8FAFC" font-size="82" font-weight="700" letter-spacing="-2.8">oc-<tspan fill="url(#title)">taskbar</tspan></text>
    <text x="82" y="308" fill="#CBD5E1" font-size="30" font-weight="500" letter-spacing="-0.4">Every background task. One glance.</text>
    <text x="82" y="352" fill="#94A3B8" font-size="19" font-weight="400">Subagents · shells · terminals · context · quota · git</text>

    <g font-size="14" font-weight="600">
      <rect x="80" y="414" width="254" height="38" rx="19" fill="#111C2E" stroke="#24344D"/>
      <text x="98" y="438" fill="#BBF7D0">✅ 30s completion trail</text>

      <rect x="348" y="414" width="252" height="38" rx="19" fill="#111C2E" stroke="#24344D"/>
      <text x="366" y="438" fill="#FDE68A">⚡ Notifications on blur</text>

      <rect x="80" y="464" width="152" height="38" rx="19" fill="#111C2E" stroke="#24344D"/>
      <text x="98" y="488" fill="#C4B5FD">🌐 EN / 中文</text>

      <rect x="246" y="464" width="222" height="38" rx="19" fill="#111C2E" stroke="#24344D"/>
      <text x="264" y="488" fill="#A5F3FC">🧩 opencode 2.3.0+</text>
    </g>

    <text x="82" y="584" fill="#64748B" font-size="16" font-weight="500">github.com/ntexplorer/oc-taskbar</text>
    <text x="82" y="610" fill="#475569" font-size="14" font-weight="400">MIT licensed · source-only TUI plugin</text>
  </g>

  <!-- right: illustrative sidebar card -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <rect x="700" y="110" width="500" height="420" rx="24" fill="#0F1B2D" stroke="#22324A"/>
    <rect x="700" y="110" width="500" height="420" rx="24" fill="url(#glowViolet)" fill-opacity="0.07"/>

    <text x="730" y="154" fill="#E2E8F0" font-size="20" font-weight="650">📋 Background tasks</text>
    <circle cx="1146" cy="148" r="4" fill="#34D399"/>
    <text x="1174" y="153" fill="#6EE7B7" font-size="14" font-weight="600" text-anchor="end">3 running</text>

    <g font-size="15">
      <rect x="726" y="176" width="448" height="50" rx="13" fill="#111C2E" stroke="#1E3049"/>
      <circle cx="750" cy="201" r="4" fill="#38BDF8"/>
      <text x="768" y="207" fill="#E2E8F0" font-weight="600">🧪  Running tests</text>
      <text x="1152" y="207" fill="#64748B" font-size="13" text-anchor="end">2m</text>

      <rect x="726" y="234" width="448" height="50" rx="13" fill="#111C2E" stroke="#1E3049"/>
      <circle cx="750" cy="259" r="4" fill="#38BDF8"/>
      <text x="768" y="265" fill="#E2E8F0" font-weight="600">🔍  Explore codebase</text>
      <text x="1152" y="265" fill="#64748B" font-size="13" text-anchor="end">1m</text>

      <rect x="726" y="292" width="448" height="50" rx="13" fill="#0D1727" stroke="#1A2A40"/>
      <circle cx="750" cy="317" r="4" fill="#34D399"/>
      <text x="768" y="323" fill="#94A3B8" font-weight="600">✅  Build project · done</text>
      <text x="1152" y="323" fill="#475569" font-size="13" text-anchor="end">just now</text>

      <rect x="726" y="350" width="448" height="50" rx="13" fill="#111C2E" stroke="#1E3049"/>
      <circle cx="750" cy="375" r="4" fill="#38BDF8"/>
      <text x="768" y="381" fill="#E2E8F0" font-weight="600">🖥️  Terminal session</text>
      <text x="1152" y="381" fill="#64748B" font-size="13" text-anchor="end">12m</text>
    </g>

    <rect x="726" y="420" width="448" height="70" rx="14" fill="#0B1524" stroke="#1E3049"/>
    <text x="748" y="448" fill="#7DD3FC" font-size="14" font-weight="600">📊 Context 42%</text>
    <text x="884" y="448" fill="#94A3B8" font-size="13">· ≈¥0.29 today</text>
    <text x="1152" y="448" fill="#C4B5FD" font-size="13" font-weight="600" text-anchor="end">💠 DS ¥237.37</text>
    <text x="748" y="472" fill="#64748B" font-size="12">📅 Today 1.2M tok · 12 prompts · ⎇ main +18/−6</text>
  </g>
</svg>
